<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat manageri · {{ agency }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-700 via-teal-700 to-cyan-800 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🤖</div>
      <h1 class="text-2xl font-extrabold text-slate-900">{{ agency }} · AI Assistant</h1>
      <p class="text-sm text-slate-500 mt-1">Acces pentru manageri</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-sm mb-4">{{ error }}</div>
    {% endif %}

    <form method="post" class="space-y-3">
      <div>
        <label class="text-sm font-semibold text-slate-700">Parola comună a echipei</label>
        <input type="password" name="password" required autofocus autocomplete="current-password"
          class="w-full mt-1 border-2 border-slate-200 rounded-lg px-3 py-2.5 focus:border-emerald-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow-md transition">
        Intră în chat
      </button>
    </form>
  </div>
</body>
</html>
