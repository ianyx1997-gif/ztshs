<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · {{ agency }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-violet-900 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🦓</div>
      <h1 class="text-2xl font-extrabold text-slate-900">{{ agency }}</h1>
      <p class="text-sm text-slate-500 mt-1">Panou operator · Acces autorizat</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-sm mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-3">
      <div>
        <label class="text-sm font-semibold text-slate-700">Utilizator</label>
        <input type="text" name="username" autofocus required autocomplete="username"
          class="w-full mt-1 border-2 border-slate-200 rounded-lg px-3 py-2.5 focus:border-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-700">Parolă</label>
        <input type="password" name="password" required autocomplete="current-password"
          class="w-full mt-1 border-2 border-slate-200 rounded-lg px-3 py-2.5 focus:border-indigo-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow-md transition">
        Intră în panou
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center">
      <a href="/turist" class="text-sm text-slate-500 hover:text-indigo-600">→ Vrei să cauți o vacanță? Mergi la pagina publică</a>
    </div>
  </div>
</body>
</html>
