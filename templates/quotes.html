{% extends "_layout.html" %}
{% block title %}Oferte · {{ agency }}{% endblock %}
{% block content %}
<div x-data="quotesApp()" x-init="init()" class="space-y-4">
  <div class="bg-white rounded-2xl shadow-sm border p-4 md:p-5 flex items-center gap-3 flex-wrap">
    <h1 class="text-xl font-bold flex-1">Oferte către clienți</h1>
    <select x-model="filter" @change="load()" class="border rounded px-2 py-1.5">
      <option value="">— toate —</option>
      <option value="open">Deschise</option>
      <option value="sent">Trimise</option>
      <option value="won">Câștigate</option>
      <option value="lost">Pierdute</option>
    </select>
    <button @click="openNew()" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded text-sm font-medium">+ Ofertă nouă</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
    <template x-for="q in items" :key="q.id">
      <div class="bg-white rounded-xl shadow-sm border p-4 hover:shadow-md transition">
        <div class="flex items-start justify-between">
          <div>
            <div class="font-semibold" x-text="q.title"></div>
            <div class="text-xs text-slate-500" x-text="q.customer_main + ' · ' + (q.customer_phone || '')"></div>
          </div>
          <span class="px-2 py-0.5 text-xs rounded-full" :class="quoteStatusClass(q.status)" x-text="quoteStatusLabel(q.status)"></span>
        </div>
        <div class="mt-2 text-sm text-slate-600" x-text="q.summary"></div>
        <div class="mt-3 flex items-center justify-between">
          <div class="font-bold text-brand-700" x-text="formatMoney(q.sale_amount, q.currency)"></div>
          <div class="flex gap-1">
            <a :href="'/api/quotes/' + q.id + '/html'" target="_blank" class="text-xs px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded">🖨️ Tipărește</a>
            <button @click="changeStatus(q, 'sent')" class="text-xs px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded" x-show="q.status==='open'">→ Trimisă</button>
            <button @click="changeStatus(q, 'won')" class="text-xs px-2 py-1 bg-green-100 hover:bg-green-200 text-green-700 rounded" x-show="q.status!=='won' && q.status!=='lost'">✓ Câștigată</button>
            <button @click="changeStatus(q, 'lost')" class="text-xs px-2 py-1 bg-red-50 hover:bg-red-100 text-red-700 rounded" x-show="q.status!=='won' && q.status!=='lost'">✗ Pierdută</button>
          </div>
        </div>
      </div>
    </template>
    <div x-show="!items.length" class="md:col-span-2 lg:col-span-3 bg-white border-2 border-dashed rounded-xl p-8 text-center text-slate-400">
      Nicio ofertă. Adaugă oferte direct din pagina de Căutare („+ Ofertă") sau folosește „+ Ofertă nouă".
    </div>
  </div>

  <div x-show="creating" x-cloak class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <div @click.away="creating=null" class="bg-white rounded-2xl shadow-2xl max-w-xl w-full">
      <div class="p-5 border-b flex justify-between">
        <h3 class="font-bold text-lg">Ofertă nouă</h3>
        <button @click="creating=null" class="text-2xl leading-none text-slate-400">×</button>
      </div>
      <div class="p-5 space-y-3">
        <input x-model="creating.customer_main" placeholder="Nume client *" class="w-full border rounded px-3 py-2">
        <input x-model="creating.customer_phone" placeholder="Telefon" class="w-full border rounded px-3 py-2">
        <input x-model="creating.title" placeholder="Titlu ofertă *" class="w-full border rounded px-3 py-2">
        <textarea x-model="creating.summary" placeholder="Detalii (destinație, hotel, plecare, etc.)" class="w-full border rounded px-3 py-2 h-24"></textarea>
        <div class="flex gap-2">
          <input type="number" step="0.01" x-model.number="creating.sale_amount" placeholder="Sumă" class="border rounded px-3 py-2 flex-1">
          <select x-model="creating.currency" class="border rounded px-3 py-2">
            <option value="EUR">EUR</option><option value="USD">USD</option><option value="MDL">MDL</option><option value="RON">RON</option>
          </select>
        </div>
      </div>
      <div class="p-5 border-t bg-slate-50 flex justify-end gap-2">
        <button @click="creating=null" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded">Anulează</button>
        <button @click="save()" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded">Salvează</button>
      </div>
    </div>
  </div>
</div>

<script>
function quotesApp() {
  return {
    items: [], filter: '', creating: null,
    async init() { await this.load(); },
    async load() {
      const r = await api.get('/api/quotes?status=' + (this.filter || ''));
      this.items = r.items || [];
    },
    openNew() { this.creating = { customer_main:'', customer_phone:'', title:'', summary:'', sale_amount: 0, currency: 'EUR' }; },
    async save() {
      const q = this.creating;
      if (!q.customer_main || !q.title) { toast('Numele și titlul sunt obligatorii', 'error'); return; }
      await api.post('/api/quotes', q);
      this.creating = null;
      await this.load();
      toast('Ofertă salvată', 'success');
    },
    async changeStatus(q, status) {
      await api.put('/api/quotes/' + q.id, { status });
      await this.load();
    },
    formatMoney,
    quoteStatusLabel(s) {
      return { open:'Deschisă', sent:'Trimisă', won:'Câștigată', lost:'Pierdută' }[s] || s;
    },
    quoteStatusClass(s) {
      return ({
        open:'bg-slate-100 text-slate-700',
        sent:'bg-blue-100 text-blue-700',
        won:'bg-green-100 text-green-700',
        lost:'bg-red-100 text-red-700',
      })[s] || 'bg-slate-100';
    },
  }
}
</script>
{% endblock %}
